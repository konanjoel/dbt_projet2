name: dbt CI

on:
  pull_request:
    branches: [master]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
      DBT_CI_SCHEMA: dbt_ci_pr_${{ github.event.number }}
      # Attention : DBT_PROFILES_DIR doit pointer vers un répertoire (ex: . ou un dossier profiles), 
      # pas vers le nom d'une target. C'est --target qu'on utilise pour la cible.
      DBT_PROFILES_DIR: .

    steps:
      - name: Récupérer le code de la PR
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dbt
        run: pip install dbt-core==1.9.4 dbt-snowflake==1.9.4

      - name: Décoder et écrire la clé privée sur le runner
        env:
          # On récupère le secret Base64 (qui ne craint pas les sauts de ligne)
          KEY_BASE64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
        run: |
          # On décode le Base64 pour recréer proprement le fichier PEM avec ses en-têtes et retours à la ligne
          echo "$KEY_BASE64" | base64 -d > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          
          # OPTIONNEL (pour vous rassurer) : Afficher les 2 premières lignes pour vérifier que le PEM est revenu
          # head -n 2 /tmp/rsa_key.p8

      - name: Installer les packages dbt
        run: dbt deps

      - name: Construire
        # On spécifie explicitement la target 'ci' ici si besoin
        run: dbt run --target ci